# The website (site/) is published to the gh-pages branch, which GitHub Pages serves at
# https://hmodymac8-droid.github.io/yomi-manga-manhwa-reader/ . It runs when site/ changes on main.
# Only GitHub's own checkout action is used, pinned to an exact version, and nothing is built or installed:
# the files are copied as they are.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Copy site/ to the gh-pages branch
        run: |
          set -euo pipefail
          cp -r site "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch gh-pages
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Website from ${GITHUB_SHA::7}"
          git push origin gh-pages
